<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organograma Executivo - CMAA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cmaa: {
                            bg: '#f1f5f9',
                            card: '#ffffff',
                            border: '#e2e8f0',
                            emerald: '#059669'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Bibliotecas de Apoio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tf-tree * { box-sizing: border-box; margin: 0; padding: 0; }
        .tf-tree ul { display: flex; justify-content: center; position: relative; padding-top: 24px; transition: all 0.3s; }
        .tf-tree li { text-align: center; list-style-type: none; position: relative; padding: 24px 12px 0 12px; }
        
        .tf-tree li::before, .tf-tree li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1; width: 50%; height: 24px;
        }
        .tf-tree li::after { right: auto; left: 50%; border-left: 2px solid #cbd5e1; }
        .tf-tree li:only-child::after, .tf-tree li:only-child::before { display: none; }
        .tf-tree li:only-child { padding-top: 0; }
        .tf-tree li:first-child::before, .tf-tree li:last-child::after { border: 0 none; }
        .tf-tree li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 8px 0 0; }
        .tf-tree li:first-child::after { border-radius: 8px 0 0 0; }
        .tf-tree ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1; width: 0; height: 24px;
        }

        .orientation-horizontal ul { flex-direction: column; align-items: flex-start; padding-top: 0; padding-left: 32px; }
        .orientation-horizontal li { text-align: left; padding: 12px 0 0 32px; }
        .orientation-horizontal li::before, .orientation-horizontal li::after, .orientation-horizontal ul ul::before { display: none; }

        .grid-compact { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 1000px; margin: 0 auto; padding-top: 16px; }

        #viewport { cursor: grab; }
        #viewport:active { cursor: grabbing; }

        .lvl-badge-1 { background-color: #0d9488; color: white; }
        .lvl-ring-1 { border-color: #0d9488; }
        .lvl-badge-2 { background-color: #16a34a; color: white; }
        .lvl-ring-2 { border-color: #16a34a; }
        .lvl-badge-3 { background-color: #d97706; color: white; }
        .lvl-ring-3 { border-color: #d97706; }
        .lvl-badge-4 { background-color: #2563eb; color: white; }
        .lvl-ring-4 { border-color: #2563eb; }
        .lvl-badge-default { background-color: #64748b; color: white; }
        .lvl-ring-default { border-color: #64748b; }
    </style>
</head>
<body id="app-body" class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans overflow-hidden">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-slate-100 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-8 w-full max-w-md shadow-xl text-center">
            <img src="CMAA.png" alt="CMAA Logo" class="h-14 mx-auto mb-6 object-contain" onerror="this.style.display='none'">
            <h2 class="text-lg font-bold text-slate-800 mb-1">Gente & Gestão</h2>
            <p class="text-xs text-slate-500 mb-6">Acesse o sistema de organograma corporativo</p>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Usuário / Matrícula</label>
                    <input type="text" id="loginUser" required placeholder="Digite sua matrícula..." 
                        class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Senha</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" 
                        class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500">
                </div>
                <div id="loginError" class="text-red-600 text-xs hidden text-center">Credenciais inválidas. Tente novamente.</div>
                <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-md shadow-emerald-900/10">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- NAVBAR TOPO -->
    <header class="h-16 border-b border-slate-200 bg-white/90 backdrop-blur px-6 flex items-center justify-between z-10 shrink-0 gap-4 shadow-sm">
        <div class="flex items-center gap-3 shrink-0">
            <img src="CMAA.png" alt="CMAA Logo" class="h-8 object-contain" onerror="this.style.display='none'">
            <div class="border-l border-slate-300 pl-3">
                <h1 class="font-bold text-sm tracking-wide text-slate-800">Organograma Executivo</h1>
                <p class="text-[10px] text-slate-500">Gente & Gestão</p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap justify-end">
            <div class="relative w-36">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar..." 
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition"
                    oninput="filterTree()">
            </div>

            <select id="layoutFormat" onchange="filterTree()" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-emerald-500 transition">
                <option value="tree">Árvore Expandida</option>
                <option value="compact">Grade Compacta (Imagem)</option>
            </select>

            <select id="orientationSelect" onchange="changeOrientation()" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-emerald-500 transition">
                <option value="vertical">Vertical</option>
                <option value="horizontal">Horizontal</option>
            </select>

            <select id="sortBy" onchange="filterTree()" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-emerald-500 transition">
                <option value="default">Ordem Padrão</option>
                <option value="name">Nome (A-Z)</option>
                <option value="hc">Maior Headcount</option>
                <option value="id">Matrícula</option>
            </select>

            <select id="levelFilter" onchange="filterTree()" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-emerald-500 transition">
                <option value="all">Todos Níveis</option>
            </select>

            <button onclick="toggleTheme()" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 p-1.5 rounded-lg text-slate-600 transition" title="Alternar Tema">
                <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
            </button>

            <div class="relative group">
                <button class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar
                </button>
                <div class="absolute right-0 mt-1 w-36 bg-white border border-slate-200 rounded-lg shadow-xl hidden group-hover:block z-50 overflow-hidden">
                    <button onclick="exportPDF()" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 flex items-center gap-2"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> PDF</button>
                    <button onclick="exportImage()" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 flex items-center gap-2"><i data-lucide="image" class="w-3.5 h-3.5"></i> Imagem (PNG)</button>
                    <button onclick="exportPPT()" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 flex items-center gap-2"><i data-lucide="presentation" class="w-3.5 h-3.5"></i> PowerPoint</button>
                </div>
            </div>

            <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-md shadow-emerald-900/20">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i> CSV
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
            </label>

            <div class="flex items-center bg-slate-50 border border-slate-300 rounded-lg p-0.5 gap-0.5">
                <button onclick="zoomOut()" class="p-1.5 hover:bg-slate-200 rounded text-slate-600 transition" title="Reduzir"><i data-lucide="zoom-out" class="w-3.5 h-3.5"></i></button>
                <button onclick="resetZoom()" class="p-1.5 hover:bg-slate-200 rounded text-slate-600 transition" title="Resetar"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></button>
                <button onclick="zoomIn()" class="p-1.5 hover:bg-slate-200 rounded text-slate-600 transition" title="Aumentar"><i data-lucide="zoom-in" class="w-3.5 h-3.5"></i></button>
            </div>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main id="viewport" class="flex-1 overflow-hidden relative w-full h-full bg-slate-100">
        <div id="pan-container" class="absolute inset-0 flex items-start justify-center p-16 transition-transform duration-100 ease-out">
            <div id="tree-wrapper" class="flex flex-col items-center p-8">
                <div id="tree-root" class="tf-tree">
                    <div class="text-center mt-20 text-slate-400">
                        <i data-lucide="file-up" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p class="text-sm font-medium text-slate-600">Importe o arquivo CSV com as colunas:<br><code class="text-xs text-emerald-600 font-mono">NUMCAD, NOME, NUMLID, CARGO, CC, FOTO</code></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        let globalData = [];
        let collapsedNodes = new Set();
        let zoomLevel = 1, isPanning = false, startX = 0, startY = 0, translateX = 0, translateY = 0;
        let isDarkMode = false;
        const viewport = document.getElementById('viewport');
        const panContainer = document.getElementById('pan-container');

        async function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            errorDiv.classList.add('hidden');
            btn.innerText = 'Autenticando...';
            btn.disabled = true;

            const apiURL = "https://0cbbf36298f0e42e8f72ebb373f876.e6.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/13c4ca7aceb94a08bb90658d07fa1141/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xtil9ZxsyJtRpn4IQnOr60f5DEgRecU4kzNSA9q3pug";

            try {
                const response = await fetch(apiURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    document.getElementById('login-screen').style.display = 'none';
                } else {
                    throw new Error('Falha na autenticação');
                }
            } catch (error) {
                console.warn('Aviso: Conexão com API falhou ou bloqueada por CORS. Liberando acesso para visualização local.');
                document.getElementById('login-screen').style.display = 'none';
            } finally {
                btn.innerText = 'Entrar no Sistema';
                btn.disabled = false;
            }
        }

        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    globalData = results.data;
                    collapsedNodes.clear();
                    initApp();
                }
            });
        });

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('app-body');
            const viewport = document.getElementById('viewport');
            
            if (isDarkMode) {
                body.classList.add('dark');
                body.classList.remove('bg-slate-100');
                body.classList.add('bg-slate-900');
                viewport.classList.remove('bg-slate-100');
                viewport.classList.add('bg-slate-900');
            } else {
                body.classList.remove('dark');
                body.classList.remove('bg-slate-900');
                body.classList.add('bg-slate-100');
                viewport.classList.remove('bg-slate-900');
                viewport.classList.add('bg-slate-100');
            }
            filterTree();
        }

        function toggleCollapse(numcad) {
            if (collapsedNodes.has(numcad)) {
                collapsedNodes.delete(numcad);
            } else {
                collapsedNodes.add(numcad);
            }
            filterTree();
        }

        function initApp() {
            const map = {};
            globalData.forEach(row => {
                const numcad = String(row.NUMCAD || '').trim();
                if (!numcad) return;
                map[numcad] = {
                    numcad: numcad,
                    nome: row.NOME || 'Sem Nome',
                    numlid: String(row.NUMLID || '').trim(),
                    cargo: row.CARGO || 'Cargo não informado',
                    cc: row.CC || 'N/A',
                    foto: row.FOTO || '',
                    children: []
                };
            });

            const roots = [];
            Object.values(map).forEach(node => {
                if (node.numlid && map[node.numlid] && node.numlid !== node.numcad) {
                    map[node.numlid].children.push(node);
                } else {
                    roots.push(node);
                }
            });

            function calculateMetrics(node, currentLevel = 1) {
                node.level = currentLevel;
                let direct = node.children.length;
                let indirect = direct;
                node.children.forEach(child => {
                    indirect += calculateMetrics(child, currentLevel + 1);
                });
                node.hcDirect = direct;
                node.hcIndirect = indirect;
                return indirect;
            }

            roots.forEach(root => calculateMetrics(root, 1));
            
            let maxDepth = 0;
            function findMaxDepth(node) {
                if (node.level > maxDepth) maxDepth = node.level;
                node.children.forEach(findMaxDepth);
            }
            roots.forEach(findMaxDepth);

            const levelSelect = document.getElementById('levelFilter');
            levelSelect.innerHTML = '<option value="all">Todos Níveis</option>';
            for (let i = 1; i <= maxDepth; i++) {
                levelSelect.innerHTML += `<option value="${i}">Até Nível ${i}</option>`;
            }

            filterTree();
        }

        function filterTree() {
            if (globalData.length === 0) return;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const maxLevel = document.getElementById('levelFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            const layoutFormat = document.getElementById('layoutFormat').value;

            const map = {};
            globalData.forEach(row => {
                const numcad = String(row.NUMCAD || '').trim();
                if (!numcad) return;
                map[numcad] = {
                    numcad: numcad,
                    nome: row.NOME || 'Sem Nome',
                    numlid: String(row.NUMLID || '').trim(),
                    cargo: row.CARGO || 'Cargo não informado',
                    cc: row.CC || 'N/A',
                    foto: row.FOTO || '',
                    children: [],
                    level: 1
                };
            });

            let roots = [];
            Object.values(map).forEach(node => {
                if (node.numlid && map[node.numlid] && node.numlid !== node.numcad) {
                    map[node.numlid].children.push(node);
                } else {
                    roots.push(node);
                }
            });

            function calculateMetrics(node, currentLevel = 1) {
                node.level = currentLevel;
                let direct = node.children.length;
                let indirect = direct;
                node.children.forEach(child => {
                    indirect += calculateMetrics(child, currentLevel + 1);
                });
                node.hcDirect = direct;
                node.hcIndirect = indirect;
                return indirect;
            }
            roots.forEach(root => calculateMetrics(root, 1));

            function sortNodes(nodes) {
                nodes.sort((a, b) => {
                    if (sortBy === 'name') return a.nome.localeCompare(b.nome);
                    if (sortBy === 'hc') return b.hcIndirect - a.hcIndirect;
                    if (sortBy === 'id') return a.numcad.localeCompare(b.numcad);
                    return 0;
                });
                nodes.forEach(n => sortNodes(n.children));
            }
            sortNodes(roots);

            function applyLevelFilter(nodes, limit) {
                return nodes.filter(node => {
                    if (limit !== 'all' && node.level > parseInt(limit)) return false;
                    node.children = applyLevelFilter(node.children, limit);
                    return true;
                });
            }
            if (maxLevel !== 'all') roots = applyLevelFilter(roots, maxLevel);

            if (searchTerm) {
                let matchedNode = null;
                Object.values(map).forEach(n => {
                    if (n.nome.toLowerCase().includes(searchTerm) || n.numcad.toLowerCase().includes(searchTerm)) {
                        matchedNode = n;
                    }
                });
                roots = matchedNode ? [matchedNode] : [];
            }

            renderTree(roots, layoutFormat);
        }

        function renderPillCard(node) {
            const badgeClass = `lvl-badge-${node.level}` in CSS ? `lvl-badge-${node.level}` : 'lvl-badge-default';
            const ringClass = `lvl-ring-${node.level}` in CSS ? `lvl-ring-${node.level}` : 'lvl-ring-default';

            const hasFoto = node.foto && node.foto.length > 5;
            const fotoHTML = hasFoto 
                ? `<img src="${node.foto}" class="w-12 h-12 rounded-full object-cover border-2 ${ringClass} shadow shrink-0" crossorigin="anonymous">`
                : `<div class="w-12 h-12 rounded-full bg-slate-200 border-2 ${ringClass} flex items-center justify-center text-slate-500 font-bold text-xs shrink-0"><i data-lucide="user" class="w-6 h-6"></i></div>`;

            const cardBg = isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-800';
            const isCollapsed = collapsedNodes.has(node.numcad);
            const hasChildren = node.children.length > 0;

            let toggleIndicator = '';
            if (hasChildren) {
                const iconName = isCollapsed ? 'chevron-right' : 'chevron-down';
                const labelText = isCollapsed ? `+${node.hcIndirect}` : node.hcDirect;
                toggleIndicator = `
                    <div onclick="event.stopPropagation(); toggleCollapse('${node.numcad}')" class="absolute -bottom-2.5 left-1/2 -translate-x-1/2 bg-emerald-600 hover:bg-emerald-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow cursor-pointer flex items-center gap-1 transition z-10" title="${isCollapsed ? 'Expandir liderados' : 'Colapsar liderados'}">
                        <span>${labelText}</span>
                        <i data-lucide="${iconName}" class="w-3 h-3"></i>
                    </div>`;
            }

            return `
                <div onclick="toggleCollapse('${node.numcad}')" class="relative inline-flex items-center ${cardBg} border rounded-full pl-2 pr-5 py-2 shadow-md w-64 hover:shadow-xl hover:border-emerald-500 transition-all cursor-pointer group">
                    <span class="absolute -top-2 right-4 text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full ${badgeClass} shadow-sm">
                        LEVEL ${String.fromCharCode(64 + node.level)}
                    </span>
                    ${fotoHTML}
                    <div class="ml-3 text-left overflow-hidden w-full">
                        <h3 class="text-xs font-bold truncate leading-tight" title="${node.nome}">${node.nome}</h3>
                        <p class="text-[10px] text-slate-400 truncate mt-0.5 font-medium" title="${node.cargo}">${node.cargo}</p>
                        <div class="flex items-center gap-2 mt-1 text-[9px] text-slate-400 font-mono">
                            <span>#${node.numcad}</span>
                            <span>•</span>
                            <span class="text-emerald-600 font-bold">Dir: ${node.hcDirect}</span>
                        </div>
                    </div>
                    ${toggleIndicator}
                </div>`;
        }

        function renderCircleCard(node) {
            const ringClass = `lvl-ring-${node.level}` in CSS ? `lvl-ring-${node.level}` : 'lvl-ring-default';
            const hasFoto = node.foto && node.foto.length > 5;
            const fotoHTML = hasFoto 
                ? `<img src="${node.foto}" class="w-14 h-14 rounded-full object-cover border-4 ${ringClass} shadow-md shrink-0 mx-auto" crossorigin="anonymous">`
                : `<div class="w-14 h-14 rounded-full bg-slate-200 border-4 ${ringClass} flex items-center justify-center text-slate-500 font-bold text-xs shrink-0 mx-auto"><i data-lucide="user" class="w-7 h-7"></i></div>`;

            const textColor = isDarkMode ? 'text-slate-200' : 'text-slate-700';

            return `
                <div onclick="toggleCollapse('${node.numcad}')" class="inline-flex flex-col items-center w-20 text-center cursor-pointer group">
                    <div class="relative">${fotoHTML}</div>
                    <span class="text-[10px] font-bold ${textColor} truncate w-full mt-1.5 block" title="${node.nome}">${node.nome.split(' ')[0]}</span>
                    <span class="text-[8px] text-slate-400 truncate w-full block" title="${node.cargo}">${node.cargo}</span>
                </div>`;
        }

        function renderNodeHTML(node, layoutFormat) {
            const isLeaf = node.children.length === 0;
            const useCircle = layoutFormat === 'compact' && isLeaf;
            const isCollapsed = collapsedNodes.has(node.numcad);

            let html = `<li>${useCircle ? renderCircleCard(node) : renderPillCard(node)}`;

            if (node.children.length > 0 && !isCollapsed) {
                if (layoutFormat === 'compact' && node.children.every(c => c.children.length === 0)) {
                    html += `<div class="grid-compact">`;
                    node.children.forEach(child => {
                        html += `<div>${renderCircleCard(child)}</div>`;
                    });
                    html += `</div>`;
                } else {
                    html += '<ul>';
                    node.children.forEach(child => {
                        html += renderNodeHTML(child, layoutFormat);
                    });
                    html += '</ul>';
                }
            }
            html += '</li>';
            return html;
        }

        function renderTree(roots, layoutFormat) {
            const container = document.getElementById('tree-root');
            if (roots.length === 0) {
                container.innerHTML = `<p class="text-red-500 text-sm text-center mt-10">Nenhum registro encontrado com os filtros selecionados.</p>`;
                return;
            }

            let html = '<ul>';
            roots.forEach(root => {
                html += renderNodeHTML(root, layoutFormat);
            });
            html += '</ul>';

            container.innerHTML = html;
            lucide.createIcons();
            applyOrientationClass();
        }

        function changeOrientation() {
            applyOrientationClass();
        }

        function applyOrientationClass() {
            const orientation = document.getElementById('orientationSelect').value;
            const treeRoot = document.getElementById('tree-root');
            if (orientation === 'horizontal') {
                treeRoot.classList.add('orientation-horizontal');
            } else {
                treeRoot.classList.remove('orientation-horizontal');
            }
        }

        // Funções de Exportação sem cortes
        async function prepareForExport() {
            const originalTransform = panContainer.style.transform;
            panContainer.style.transform = 'translate(0px, 0px) scale(1)';
            await new Promise(resolve => setTimeout(resolve, 400));
            return originalTransform;
        }

        async function restoreAfterExport(originalTransform) {
            panContainer.style.transform = originalTransform;
        }

        async function exportImage() {
            const origTransform = await prepareForExport();
            const target = document.getElementById('tree-wrapper');
            const bg = isDarkMode ? '#0f172a' : '#f1f5f9';

            html2canvas(target, { backgroundColor: bg, scale: 2, useCORS: true, scrollY: -window.scrollY }).then(async canvas => {
                const link = document.createElement('a');
                link.download = 'organograma-cmaa.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                await restoreAfterExport(origTransform);
            });
        }

        async function exportPDF() {
            const origTransform = await prepareForExport();
            const target = document.getElementById('tree-wrapper');
            const bg = isDarkMode ? '#0f172a' : '#f1f5f9';

            html2canvas(target, { backgroundColor: bg, scale: 2, useCORS: true, scrollY: -window.scrollY }).then(async canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                
                const imgWidth = 297;
                const pageHeight = 210;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let heightLeft = imgHeight;
                let position = 0;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }

                pdf.save('organograma-cmaa.pdf');
                await restoreAfterExport(origTransform);
            });
        }

        async function exportPPT() {
            const origTransform = await prepareForExport();
            const target = document.getElementById('tree-wrapper');
            const bg = isDarkMode ? '0F172A' : 'F1F5F9';

            html2canvas(target, { backgroundColor: isDarkMode ? '#0f172a' : '#f1f5f9', scale: 2, useCORS: true, scrollY: -window.scrollY }).then(async canvas => {
                const imgData = canvas.toDataURL('image/png');
                let pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';
                let slide = pptx.addSlide();
                slide.background = { color: bg };
                
                // Calcula proporção exata para o PPTx preencher o slide de forma responsiva sem cortar as pontas
                const imgProps = pptx.getImageProperties(imgData);
                const slideWidth = 13.333; // Largura do slide 16:9 em polegadas
                const slideHeight = 7.5;   // Altura do slide 16:9 em polegadas
                
                let w = slideWidth - 1.0;
                let h = (imgProps.h * w) / imgProps.w;
                
                if (h > (slideHeight - 1.0)) {
                    h = slideHeight - 1.0;
                    w = (imgProps.w * h) / imgProps.h;
                }
                
                let x = (slideWidth - w) / 2;
                let y = (slideHeight - h) / 2;

                slide.addImage({ data: imgData, x: x, y: y, w: w, h: h });
                pptx.writeFile({ fileName: 'organograma-cmaa.pptx' });
                await restoreAfterExport(origTransform);
            });
        }

        // Zoom & Pan
        function updateTransform() {
            panContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;
        }
        function zoomIn() { zoomLevel = Math.min(zoomLevel + 0.15, 2.5); updateTransform(); }
        function zoomOut() { zoomLevel = Math.max(zoomLevel - 0.15, 0.3); updateTransform(); }
        function resetZoom() { zoomLevel = 1; translateX = 0; translateY = 0; updateTransform(); }

        viewport.addEventListener('mousedown', (e) => { isPanning = true; startX = e.clientX - translateX; startY = e.clientY - translateY; });
        window.addEventListener('mousemove', (e) => { if (!isPanning) return; translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); });
        window.addEventListener('mouseup', () => { isPanning = false; });
    </script>
</body>
